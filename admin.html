<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dez Choob | دز چوب — پنل مدیریت</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{
  --brown-dark:#4a2c1a; --brown:#6b4226; --brown-light:#8b5e3c;
  --cream:#f5efe6; --cream-dark:#e8ddd0; --white:#fff;
  --accent:#d4a373; --green:#2d6a4f; --red:#c1121f;
  --shadow:0 2px 12px rgba(74,44,26,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--cream);color:var(--brown-dark);line-height:1.7;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--brown),var(--brown-dark))}
.auth-card{background:var(--white);border-radius:14px;padding:36px 28px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.auth-card h1{font-size:1.3rem;margin-bottom:6px;text-align:center;color:var(--brown-dark)}
.auth-card p.sub{text-align:center;color:var(--brown-light);margin-bottom:24px;font-size:.9rem}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:.9rem;font-weight:600;color:var(--brown)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:11px 14px;border:2px solid var(--cream-dark);border-radius:8px;font-size:.95rem;outline:none;background:var(--cream);color:var(--brown-dark);transition:border-color .2s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--brown-light)}
.form-group textarea{resize:vertical;min-height:90px}
.btn{padding:12px 24px;border:none;border-radius:8px;font-size:1rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--brown);color:var(--cream)}
.btn-primary:hover{background:var(--brown-dark)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-secondary{background:var(--cream-dark);color:var(--brown-dark)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 14px;font-size:.85rem}
.btn-full{width:100%}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:.9rem;display:none}
.alert.show{display:block}
.alert-error{background:#fde8e8;color:var(--red);border:1px solid #f5b5b5}
.alert-success{background:#d8f3dc;color:var(--green);border:1px solid #95d5b2}

/* DASHBOARD */
.dashboard{max-width:1200px;margin:0 auto;padding:20px}
.dash-header{display:flex;justify-content:space-between;align-items:center;background:var(--brown-dark);color:var(--cream);padding:14px 20px;border-radius:10px;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.dash-header h1{font-size:1.1rem}
.dash-header .actions{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--white);border-radius:10px;padding:20px;box-shadow:var(--shadow);text-align:center}
.stat .num{font-size:1.8rem;font-weight:700;color:var(--brown)}
.stat .label{font-size:.9rem;color:var(--brown-light);margin-top:4px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:10px 20px;border:2px solid var(--brown-light);background:var(--white);color:var(--brown);border-radius:24px;font-size:.9rem;transition:all .2s}
.tab.active{background:var(--brown);color:var(--cream);border-color:var(--brown)}
.panel{display:none}
.panel.active{display:block}
.panel-card{background:var(--white);border-radius:12px;padding:24px;box-shadow:var(--shadow)}
.panel-card h2{margin-bottom:18px;color:var(--brown);font-size:1.2rem}

/* UPLOAD */
.upload-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:10px}
.upload-box{aspect-ratio:1;border:2px dashed var(--brown-light);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;background:var(--cream);transition:background .2s}
.upload-box:hover{background:var(--cream-dark)}
.upload-box img{width:100%;height:100%;object-fit:cover}
.upload-box .rm{position:absolute;top:4px;left:4px;background:rgba(193,18,31,.9);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.upload-box .plus{font-size:2rem;color:var(--brown-light)}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--cream-dark)}
th{background:var(--cream);font-weight:700;color:var(--brown)}
td img{width:50px;height:50px;object-fit:cover;border-radius:6px;background:var(--cream-dark)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--white);border-radius:12px;padding:24px;max-width:400px;width:100%}
.modal h3{margin-bottom:12px;color:var(--brown-dark)}
.modal p{margin-bottom:20px;color:var(--brown-light)}
.modal .actions{display:flex;gap:10px;justify-content:flex-start}
</style>
</head>
<body>

<!-- LOGIN VIEW -->
<div id="loginView" class="auth-wrap">
  <div class="auth-card">
    <h1>🔐 ورود مدیر</h1>
    <p class="sub">Dez Choob | دز چوب</p>
    <div class="alert alert-error" id="loginErr"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>ایمیل مدیر</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>رمز عبور</label>
        <input type="password" id="loginPass" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="loginBtn">ورود</button>
    </form>
  </div>
</div>

<!-- DASHBOARD VIEW -->
<div id="dashView" class="dashboard" style="display:none">
  <div class="dash-header">
    <h1>🪵 Dez Choob | دز چوب — پنل مدیریت</h1>
    <div class="actions">
      <a href="index.html" class="btn btn-secondary btn-sm">🌐 مشاهده فروشگاه</a>
      <button class="btn btn-danger btn-sm" id="logoutBtn">🚪 خروج</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="statTotal">۰</div><div class="label">کل محصولات</div></div>
    <div class="stat"><div class="num" id="statInStock">۰</div><div class="label">موجود در انبار</div></div>
    <div class="stat"><div class="num" id="statDiscount">۰</div><div class="label">دارای تخفیف</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="add">➕ افزودن محصول</button>
    <button class="tab" data-tab="list">📋 محصولات ثبت‌شده</button>
  </div>

  <!-- PANEL: ADD -->
  <div class="panel active" id="panel-add">
    <div class="panel-card">
      <h2>افزودن محصول جدید</h2>
      <div class="alert alert-error" id="addErr"></div>
      <div class="alert alert-success" id="addOk"></div>
      <form id="addForm">
        <div class="form-group">
          <label>نام محصول *</label>
          <input type="text" id="pName" required maxlength="120">
        </div>
        <div class="form-group">
          <label>توضیحات</label>
          <textarea id="pDesc" rows="3"></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="form-group">
            <label>قیمت اصلی (تومان) *</label>
            <input type="number" id="pPrice" required min="0" step="1000">
          </div>
          <div class="form-group">
            <label>درصد تخفیف</label>
            <input type="number" id="pDiscount" min="0" max="100" value="0">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="form-group">
            <label>دسته‌بندی</label>
            <select id="pCategory">
              <option value="دکوری">دکوری</option>
              <option value="آشپزخانه">آشپزخانه</option>
              <option value="اداری">اداری</option>
              <option value="هدیه">هدیه</option>
              <option value="عمومی">عمومی</option>
            </select>
          </div>
          <div class="form-group">
            <label>تعداد موجودی *</label>
            <input type="number" id="pStock" required min="0" value="0">
          </div>
        </div>
        <div class="form-group">
          <label>تصاویر محصول (حداقل ۱ — حداکثر ۴ — تصویر اول = تصویر اصلی)</label>
          <div class="upload-grid" id="uploadGrid"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="addBtn">✅ ثبت محصول</button>
      </form>
    </div>
  </div>

  <!-- PANEL: LIST -->
  <div class="panel" id="panel-list">
    <div class="panel-card">
      <h2>محصولات ثبت‌شده</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>تصویر</th><th>نام</th><th>قیمت</th><th>تخفیف</th><th>موجودی</th><th>دسته</th><th>عملیات</th>
            </tr>
          </thead>
          <tbody id="prodBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3>ویرایش محصول</h3>
    <div class="alert alert-error" id="editErr"></div>
    <div class="form-group">
      <label>نام</label>
      <input type="text" id="eName">
    </div>
    <div class="form-group">
      <label>توضیحات</label>
      <textarea id="eDesc" rows="3"></textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="form-group"><label>قیمت</label><input type="number" id="ePrice" min="0"></div>
      <div class="form-group"><label>تخفیف ٪</label><input type="number" id="eDiscount" min="0" max="100"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="form-group">
        <label>دسته</label>
        <select id="eCategory">
          <option value="دکوری">دکوری</option>
          <option value="آشپزخانه">آشپزخانه</option>
          <option value="اداری">اداری</option>
          <option value="هدیه">هدیه</option>
          <option value="عمومی">عمومی</option>
        </select>
      </div>
      <div class="form-group"><label>موجودی</label><input type="number" id="eStock" min="0"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="saveEditBtn">💾 ذخیره</button>
      <button class="btn btn-secondary" onclick="closeEdit()">انصراف</button>
    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-bg" id="delModal">
  <div class="modal">
    <h3>⚠️ تأیید حذف</h3>
    <p>آیا مطمئنی می‌خواهی این محصول را حذف کنی؟ این عمل قابل بازگشت نیست.</p>
    <div class="actions">
      <button class="btn btn-danger" id="confirmDelBtn">حذف</button>
      <button class="btn btn-secondary" onclick="closeDel()">انصراف</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================
   Dez Choob | دز چوب — تنظیمات (باید با index.html یکسان باشد)
============================================ */
const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR_ANON_PUBLIC_KEY';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================
   Utilities
============================================ */
function esc(s){return s?String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])):''}
function fmt(n){return Number(n||0).toLocaleString('fa-IR')}
function imgUrl(images,idx=0){
  if(!images||!images.length)return '';
  const img=images[idx];
  if(typeof img==='string'&&img.startsWith('http'))return img;
  return db.storage.from('product-images').getPublicUrl(img).data.publicUrl;
}
function showAlert(el,msg,type){el.textContent=msg;el.className='alert alert-'+type+' show';setTimeout(()=>{el.className='alert'},5000);}

/* ============================================
   AUTH
============================================ */
const loginView=document.getElementById('loginView');
const dashView=document.getElementById('dashView');

async function checkSession(){
  const {data:{session}}=await db.auth.getSession();
  if(session){showDash();}else{showLogin();}
}
function showLogin(){loginView.style.display='flex';dashView.style.display='none';}
function showDash(){loginView.style.display='none';dashView.style.display='block';loadProducts();}

document.getElementById('loginForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('loginErr');
  btn.disabled=true;btn.textContent='در حال ورود...';
  const {error}=await db.auth.signInWithPassword({
    email:document.getElementById('loginEmail').value.trim(),
    password:document.getElementById('loginPass').value
  });
  btn.disabled=false;btn.textContent='ورود';
  if(error){showAlert(err,'ایمیل یا رمز عبور نادرست است.','error');return;}
  showDash();
});

document.getElementById('logoutBtn').addEventListener('click',async()=>{
  await db.auth.signOut();
  showLogin();
});

/* ============================================
   State
============================================ */
let products=[];
let uploadFiles=[]; // {file:File, url:string}
let editTargetId=null;
let deleteTargetId=null;

/* ============================================
   Load products
============================================ */
async function loadProducts(){
  const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});
  if(error){console.error(error);return;}
  products=data||[];
  renderStats();
  renderTable();
}

function renderStats(){
  document.getElementById('statTotal').textContent=fmt(products.length);
  document.getElementById('statInStock').textContent=fmt(products.filter(p=>p.stock>0).length);
  document.getElementById('statDiscount').textContent=fmt(products.filter(p=>p.discount_percent>0).length);
}

function renderTable(){
  const tbody=document.getElementById('prodBody');
  if(!products.length){
    tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--brown-light)">هنوز محصولی ثبت نشده است.</td></tr>';
    return;
  }
  tbody.innerHTML='';
  products.forEach(p=>{
    const url=imgUrl(p.images);
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${url?`<img src="${url}">`:'—'}</td>
      <td>${esc(p.name)}</td>
      <td>${fmt(p.price)} ت</td>
      <td>${p.discount_percent>0?p.discount_percent+'٪':'—'}</td>
      <td>${fmt(p.stock)}</td>
      <td>${esc(p.category||'—')}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="openEdit(${p.id})">✏️ ویرایش</button>
        <button class="btn btn-danger btn-sm" onclick="openDel(${p.id})">🗑️ حذف</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

/* ============================================
   Tabs
============================================ */
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+t.dataset.tab).classList.add('active');
  };
});

/* ============================================
   Image upload
============================================ */
const uploadGrid=document.getElementById('uploadGrid');

function renderUploads(){
  uploadGrid.innerHTML='';
  uploadFiles.forEach((f,i)=>{
    const box=document.createElement('div');
    box.className='upload-box';
    box.innerHTML=`<img src="${f.url}"><button type="button" class="rm" onclick="removeUpload(${i})">✕</button>`;
    uploadGrid.appendChild(box);
  });
  if(uploadFiles.length<4){
    const add=document.createElement('div');
    add.className='upload-box';
    add.innerHTML='<span class="plus">+</span>';
    add.onclick=()=>document.getElementById('fileInput').click();
    uploadGrid.appendChild(add);
  }
}

function removeUpload(i){
  URL.revokeObjectURL(uploadFiles[i].url);
  uploadFiles.splice(i,1);
  renderUploads();
}

// file input مخفی
const fileInput=document.createElement('input');
fileInput.type='file';
fileInput.accept='image/*';
fileInput.multiple=true;
fileInput.id='fileInput';
fileInput.style.display='none';
document.body.appendChild(fileInput);

fileInput.addEventListener('change',e=>{
  const files=Array.from(e.target.files);
  const remaining=4-uploadFiles.length;
  files.slice(0,remaining).forEach(f=>{
    if(f.size>5*1024*1024){alert('حجم هر تصویر باید کمتر از ۵ مگابایت باشد.');return;}
    uploadFiles.push({file:f,url:URL.createObjectURL(f)});
  });
  renderUploads();
  fileInput.value='';
});

renderUploads();

/* ============================================
   Add product
============================================ */
document.getElementById('addForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const err=document.getElementById('addErr');
  const ok=document.getElementById('addOk');
  const btn=document.getElementById('addBtn');

  if(uploadFiles.length===0){showAlert(err,'حداقل یک تصویر برای محصول الزامی است.','error');return;}

  const name=document.getElementById('pName').value.trim();
  const price=parseInt(document.getElementById('pPrice').value);
  const discount=parseInt(document.getElementById('pDiscount').value)||0;
  const stock=parseInt(document.getElementById('pStock').value);

  if(!name){showAlert(err,'نام محصول الزامی است.','error');return;}
  if(isNaN(price)||price<0){showAlert(err,'قیمت نامعتبر است.','error');return;}
  if(discount<0||discount>100){showAlert(err,'درصد تخفیف باید بین ۰ تا ۱۰۰ باشد.','error');return;}
  if(isNaN(stock)||stock<0){showAlert(err,'موجودی نامعتبر است.','error');return;}

  btn.disabled=true;btn.textContent='در حال آپلود تصاویر...';

  try{
    const paths=[];
    for(const f of uploadFiles){
      const ext=f.file.name.split('.').pop()||'jpg';
      const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const {error:upErr}=await db.storage.from('product-images').upload(path,f.file,{cacheControl:'3600',upsert:false});
      if(upErr)throw upErr;
      paths.push(path);
    }

    btn.textContent='در حال ثبت محصول...';
    const {error:insErr}=await db.from('products').insert([{
      name,
      description:document.getElementById('pDesc').value.trim(),
      price,
      discount_percent:discount,
      category:document.getElementById('pCategory').value,
      stock,
      images:paths
    }]);
    if(insErr)throw insErr;

    showAlert(ok,'محصول با موفقیت ثبت شد.','success');
    document.getElementById('addForm').reset();
    uploadFiles.forEach(f=>URL.revokeObjectURL(f.url));
    uploadFiles=[];
    renderUploads();
    await loadProducts();
  }catch(ex){
    console.error(ex);
    showAlert(err,'خطا در ثبت محصول: '+(ex.message||'نامشخص'),'error');
  }finally{
    btn.disabled=false;btn.textContent='✅ ثبت محصول';
  }
});

/* ============================================
   Edit product
============================================ */
function openEdit(id){
  const p=products.find(x=>x.id===id);
  if(!p)return;
  editTargetId=id;
  document.getElementById('eName').value=p.name;
  document.getElementById('eDesc').value=p.description||'';
  document.getElementById('ePrice').value=p.price;
  document.getElementById('eDiscount').value=p.discount_percent||0;
  document.getElementById('eCategory').value=p.category||'عمومی';
  document.getElementById('eStock').value=p.stock;
  document.getElementById('editErr').className='alert';
  document.ge
